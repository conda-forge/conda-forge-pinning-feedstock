  commit_message: |
    Upgrade to CUDA 13.4

    CUDA 13.4 brings important features and bug fixes compared to CUDA 13.0. Support for
    Windows on Arm (WoA) is added in 13.4. The WoA migration will be a separate, opt-in
    migration that depends on this migration.

    Since CUDA 12.8, the conda-forge nvcc package sets environment variables `CUDAARCHS` and
    `NVCC_GENCODE` in its activation script to a string containing all of the supported real
    architectures plus the virtual architecture of the latest.

    Since torch 2.10, the conda-forge libtorch package has set the environment variable
    `CF_TORCH_CUDA_ARCH_LIST` to track the architectures that torch is built with on this
    channel.

    Feedstock maintainers are encouraged to use these variables to control
    their build or override them in their build script.

    ref: https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/index.html#new-features

