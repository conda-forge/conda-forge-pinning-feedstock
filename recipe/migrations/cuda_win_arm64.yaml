  check_solvable: false
  primary_key: cuda_compiler_version
  wait_for_migrators:
    - supportwindowsarm64platform
  exclude_pinned_pkgs: false
  commit_message: "Rebuild for CUDA on Windows on ARM (#8944)"

cuda_compiler:                 # [win and arm64]
  - cuda-nvcc                  # [win and arm64]
cuda_compiler_version:         # [win and arm64 and os.environ.get("CF_CUDA_ENABLED", "False") == "True"]
